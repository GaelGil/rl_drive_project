<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#000000">
    <title>Rust Asteroids</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <style>
      html,
      body {
        min-height: 100%;
        background: #000;
      }

      .game-shell {
        min-height: calc(100vh - 2rem);
      }

      .legend-card {
        max-width: 18rem;
        background-color: #000;
      }

      .game-canvas {
        display: block;
        width: min(800px, 100%, calc((100vh - 2rem) * 4 / 3));
        height: auto;
        aspect-ratio: 4 / 3;
        background: #000;
      }

      @media (max-width: 1199.98px) {
        .legend-card {
          max-width: 800px;
        }

        .game-canvas {
          width: min(800px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <main class="container-fluid px-3 py-3">
      <div class="game-shell row g-3 align-items-xl-center justify-content-center">
        <aside
          class="col-12 col-xl-2 d-flex justify-content-center justify-content-xl-end"
          aria-labelledby="controls-title"
        >
          <div class="legend-card card w-100">
            <div class="card-body">
              <p class="mb-1 small fw-semibold text-secondary text-uppercase">
                Rust Asteroids
              </p>
              <h1 id="controls-title" class="h4 mb-3">Controls</h1>

              <ul class="list-group list-group-flush mb-3">
                <li
                  class="list-group-item d-flex align-items-center justify-content-between bg-transparent px-0"
                >
                  <span>Shoot</span>
                  <kbd>Space</kbd>
                </li>
                <li
                  class="list-group-item d-flex align-items-center justify-content-between gap-3 bg-transparent px-0"
                >
                  <span>Move</span>
                  <span class="d-flex flex-wrap align-items-center justify-content-end gap-1">
                    <kbd>A</kbd>
                    <kbd>D</kbd>
                    <span class="small text-secondary">or</span>
                    <kbd aria-label="Left arrow">←</kbd>
                    <kbd aria-label="Right arrow">→</kbd>
                  </span>
                </li>
                <li
                  class="list-group-item d-flex align-items-center justify-content-between bg-transparent px-0"
                >
                  <span>Restart</span>
                  <kbd>R</kbd>
                </li>
              </ul>

              <nav class="d-grid gap-2 d-sm-flex" aria-label="Project links">
                <a
                  class="btn btn-outline-light btn-sm flex-fill"
                  href="https://gaelgil.com"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Personal website (opens in a new tab)"
                >Website</a>
                <a
                  class="btn btn-outline-light btn-sm flex-fill"
                  href="https://github.com/GaelGil/rl_drive_project"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="GitHub repository (opens in a new tab)"
                >GitHub</a>
              </nav>
            </div>
          </div>
        </aside>

        <section
          class="col-12 col-xl-8 d-flex justify-content-center"
          aria-label="Rust Asteroids game"
        >
          <canvas
            id="glcanvas"
            class="game-canvas border border-secondary-subtle shadow-lg"
            tabindex="0"
            aria-label="Playable Rust Asteroids game canvas"
          ></canvas>
        </section>

        <div class="d-none d-xl-block col-xl-2" aria-hidden="true"></div>
      </div>
    </main>

    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>load("./asteroids_client.wasm");</script>
  </body>
</html>
